name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Um deploy por vez na main; em PR, uma execução nova cancela a anterior
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Mínimo por padrão; cada job pede só o que precisa
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  NODE_VERSION: 22

jobs:
  # ---------------------------------------------------------------
  # Estágio 1 — Verificação estática + testes unitários (fail-fast)
  # ---------------------------------------------------------------
  validate:
    name: Lint, segredos e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks varre todo o histórico

      - name: Varredura de segredos (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes unitários com cobertura (mínimo 80%)
        run: npm run test:coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publica os alertas na aba Security
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Revisão de dependências do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------
  # Estágios 2 e 3 — Build do artefato imutável, scan de CVE e registry
  # ---------------------------------------------------------------
  build:
    name: Build da imagem, scan e publicação
    needs: [validate, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Definir referência da imagem (tag = SHA do commit)
        id: ref
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de vulnerabilidades da imagem (Trivy)
        # Pinado por SHA: tags desta action já foram sequestradas em ataque de supply chain
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Enviar resultado do Trivy para a aba Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem no registry
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.ref.outputs.image }}"

  # ---------------------------------------------------------------
  # Estágio 4 — Ambiente de STAGING: validação dinâmica da imagem publicada
  # ---------------------------------------------------------------
  deploy-staging:
    name: Deploy em Staging + testes dinâmicos
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Implantar a imagem publicada
        run: docker run -d --name app -p 8080:8080 "$IMAGE"

      - name: Health check
        run: |
          for _ in $(seq 1 15); do
            curl -fsS "$BASE_URL/health" && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Testes E2E (Playwright) contra staging
        run: npm run test:e2e

      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: DAST (OWASP ZAP baseline)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.BASE_URL }}
          cmd_options: "-I" # reprova só alertas FAIL; avisos ficam no relatório
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report

  # ---------------------------------------------------------------
  # Estágio 5 — Ambiente de PRODUÇÃO: promoção do mesmo artefato
  # Continuous Deployment: sem aprovação manual. Para exigir, adicione
  # required reviewers em Settings → Environments → production
  # ---------------------------------------------------------------
  deploy-production:
    name: Deploy em Produção (GitHub Pages)
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair os arquivos da imagem validada em staging (sem recompilar)
        run: |
          docker create --name release "$IMAGE"
          docker cp release:/usr/share/nginx/html ./site
          docker rm release

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
